name: Isolated managed installation

on:
  push:
    paths:
      - '.github/workflows/guest-mainflow.yml'
      - 'tests/integration/**'
      - 'lib/**'
      - 'adapters/**'
      - 'bin/pnm'
      - 'VERSION'
      - 'install.sh'
  workflow_dispatch:
    inputs:
      os:
        description: Native guest OS
        type: choice
        options: [all, debian13, debian12, ubuntu24, ubuntu22]
        default: all
      arch:
        description: Native runner and guest architecture
        type: choice
        options: [all, amd64, arm64]
        default: all
      arm64_runner:
        description: GitHub-hosted ARM64 host image (managed guest OS is selected above)
        type: choice
        options: [ubuntu-24.04-arm, ubuntu-26.04-arm]
        default: ubuntu-24.04-arm
      backend:
        description: Isolated systemd or independent KVM reboot
        type: choice
        options: [nspawn, qemu]
        default: nspawn
      scenario:
        description: Existing bounded mainflow scenario
        type: choice
        options: [lifecycle, external-ca, external-ca-mismatch, core-update, dependency-refusal, deployment-startup-failure, core-update-failure, restore-failure, runtime-evidence, release-acceptance]
        default: lifecycle

permissions:
  contents: read

jobs:
  managed-installation:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        os: ${{ inputs.os && inputs.os != 'all' && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["debian12","debian13","ubuntu22","ubuntu24"]') }}
        backend: ${{ fromJSON(format('["{0}"]', inputs.backend || 'nspawn')) }}
        include: ${{ inputs.backend && fromJSON('[]') || fromJSON('[{"os":"debian13","arch":"amd64","backend":"qemu"}]') }}
        arch: ${{ inputs.arch && inputs.arch != 'all' && fromJSON(format('["{0}"]', inputs.arch)) || fromJSON('["amd64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && (inputs.arm64_runner || 'ubuntu-24.04-arm') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      PNM_CI_OS: ${{ matrix.os }}
      PNM_CI_ARCH: ${{ matrix.arch }}
      PNM_CI_BACKEND: ${{ matrix.backend }}
      PNM_CI_SCENARIO: ${{ inputs.scenario || 'lifecycle' }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install disposable runner prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes systemd-container python3 jq curl unzip
          if [[ "$PNM_CI_BACKEND" == qemu ]]; then
              [[ "$PNM_CI_SCENARIO" == lifecycle ]] || { echo "VM pilot currently accepts lifecycle only"; exit 64; }
              uname -m
              uname -r
              if [[ ! -c /dev/kvm ]] && command -v modprobe >/dev/null; then
                  if ! sudo modprobe kvm; then echo 'KVM module could not be enabled on this runner'; fi
              fi
              [[ -c /dev/kvm ]] || { echo 'KVM unavailable: independent reboot remains unverified'; exit 69; }
              if [[ "$PNM_CI_ARCH" == amd64 ]]; then packages=(qemu-system-x86 seabios); else packages=(qemu-system-arm); fi
              sudo apt-get install --yes --no-install-recommends "${packages[@]}" e2fsprogs
          fi

      - name: Prepare and verify native boot fixture, then run existing mainflow
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,PNM_CI_OS,PNM_CI_ARCH,PNM_CI_SCENARIO,PNM_CI_BACKEND,GITHUB_SHA bash -Eeuo pipefail <<'BASH'
          umask 077
          source lib/common.sh
          source lib/config.sh
          source adapters/assets.sh
          [[ "$(pnm_arch)" == "$PNM_CI_ARCH" ]]
          work="$(mktemp -d /var/tmp/pnm-ci-mainflow.XXXXXXXX)"
          public="$PWD/ci-evidence"
          mkdir -m 0755 -- "$public"
          python3 - "$public/identity.json" <<'PY'
          import json,os,pathlib,platform,sys
          path=pathlib.Path(sys.argv[1])
          path.write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'guest':os.environ['PNM_CI_OS'],
              'architecture':platform.machine(),'scenario':os.environ['PNM_CI_SCENARIO'],'backend':os.environ['PNM_CI_BACKEND']},indent=2)+'\n')
          path.chmod(0o644)
          PY
          case "$(pnm_arch)" in
              amd64) suffix='' ;;
              arm64) suffix=_arm64 ;;
              *) exit 78 ;;
          esac
          for generation in real previous; do
              if [[ "$generation" == previous && "$PNM_CI_SCENARIO" != core-update && "$PNM_CI_SCENARIO" != core-update-failure ]]; then
                  continue
              fi
              manifest="tests/integration/${generation}_core_versions${suffix}.json"
              mkdir -m 0700 -- "$work/$generation"
              for core in xray hysteria2; do
                  version="$(jq -er --arg core "$core" '.[$core].version' "$manifest")"
                  hash="$(jq -er --arg core "$core" '.[$core].sha256' "$manifest")"
                  filename="$(jq -er --arg core "$core" '.[$core].filename' "$manifest")"
                  pnm_asset_download_verified "$core" "$version" "$hash" "$work/$generation/$filename"
              done
          done
          kernel=()
          if [[ "$PNM_CI_BACKEND" == qemu ]]; then kernel=(--with-kernel); fi
          PNM_RUN_GUEST_PREPARE=1 bash tests/integration/prepare_guest_baseline.sh "$PNM_CI_OS" "$work/baseline" "${kernel[@]}"
          install -m 0644 -- "$work/baseline/template.json" "$public/template.json"
          install -m 0644 -- "$work/baseline/rootfs/opt/pnm-template-packages.txt" "$public/packages.txt"
          nspawn="$(realpath "$(command -v systemd-nspawn)")"
          PNM_RUN_GUEST_TESTS=1 python3 -B tests/integration/test_guest_mainflow.py \
              --baseline "$work/baseline" --nspawn "$nspawn" --asset-cache "$work/real" \
              --boot-only --work-dir "$work"
          previous=()
          if [[ -d "$work/previous" ]]; then previous=(--previous-asset-cache "$work/previous"); fi
          backend=()
          if [[ "$PNM_CI_BACKEND" == qemu ]]; then backend=(--vm-reboot); export PNM_RUN_VM_TESTS=1; fi
          PNM_RUN_GUEST_TESTS=1 python3 -B tests/integration/test_guest_mainflow.py \
              --baseline "$work/baseline" --nspawn "$nspawn" --asset-cache "$work/real" \
              "${backend[@]}" --scenario "$PNM_CI_SCENARIO" --work-dir "$work" "${previous[@]}"
          if [[ "$PNM_CI_BACKEND" == qemu ]]; then
              result=("$work"/pnm-install-guest.*/vm-result.json)
              [[ ${#result[@]} == 1 && -f "${result[0]}" ]]
              install -m 0644 -- "${result[0]}" "$public/vm-result.json"
          fi
          # Publish only fixed metadata; journals, snapshots and guest logs stay private.
          printf '{"boot_verified":true,"mainflow_passed":true}\n' > "$public/result.json"
          chmod 0644 -- "$public/result.json"
          BASH

      - name: Retain sanitized fixture identity and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-installation-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.backend }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-evidence/identity.json
            ci-evidence/template.json
            ci-evidence/result.json
            ci-evidence/packages.txt
            ci-evidence/vm-result.json
          if-no-files-found: ignore
          retention-days: 7
